# Copia este archivo a "config.toml" y rellena tus datos.
# La contraseña se puede omitir aquí y pasar por la variable de entorno NAUTA_PASS.

[nauta]
username = "pepelam@nauta.com.cu"
# password = "Mad3l4m65."

# Crédito CUPs consumidos por cada hora de servicio (tu tarifa).
cup_per_hour = 12.5

# Segundos entre consultas de saldo al portal seguro.
saldo_interval = 3600

# Segundos entre pruebas de velocidad (0 = desactivarlas). Cada prueba usa
# ~10 s de bajada + 10 s de subida, así que consume saldo/tiempo real.
speedtest_interval = 1800

[speedtest]
# fast.com (Netflix): mide la velocidad real de tu internet internacional.
# No usa el servidor interno de ETECSA, así que necesita sesión Nauta activa.
api_url = "https://api.fast.com"
# Token público de fast.com. Déjalo vacío salvo que Netflix lo cambie.
# token = ""
# Conexiones paralelas para la descarga.
connections = 3
# Segundos máximos por dirección (descarga y subida).
max_duration = 10
# Tope de datos por dirección, en MB.
max_mb = 50

[alerts]
# Alertar cuando queden menos de estas horas de servicio.
min_balance_hours = 24
# Comando opcional ejecutado al dispararse la alerta (p. ej. notify-send '...').
# on_alert = "notify-send 'Nauta' 'Quedan menos de 24 horas'"
